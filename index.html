function slug(s,i){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+i}
function initProducts(){return seed.map((x,i)=>({id:slug(x[0]+'-'+x[1],i),brand:x[0],name:x[1],cat:x[2],goal:x[3],active:x[4],notes:x[5],uses:0,plant:i%2?'green':'pink',created:new Date().toISOString()}))}
let products=JSON.parse(localStorage.getItem('pg3-products')||'null')||initProducts();let history=JSON.parse(localStorage.getItem('pg3-history')||'[]');let settings=JSON.parse(localStorage.getItem('pg3-settings')||'null')||{theme:'pink',seasonal:true,celebrations:true,reminders:true,defaultGoal:30};let current=null,backStack=[],gardenFilter='Active',collectionCat='All',editing=null,selectedPlant='pink',calDate=new Date(),selectedDate=new Date();
function save(){localStorage.setItem('pg3-products',JSON.stringify(products));localStorage.setItem('pg3-history',JSON.stringify(history));localStorage.setItem('pg3-settings',JSON.stringify(settings))}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function plantSVG(kind='pink',stage=4){let c=kind==='green'?'#7e9b72':kind==='gold'?'#d8aa5d':kind==='slate'?'#8199a8':'#e08d96', leaf=kind==='slate'?'#708a8d':'#6f9567';let leaves=stage<1?'':stage<2?`<path d="M50 49Q30 30 28 13Q48 17 52 39" fill="${leaf}"/>`:stage<3?`<path d="M49 50Q22 35 23 12Q45 16 51 40M52 48Q75 30 78 10Q57 13 51 39" fill="${leaf}"/>`:`<path d="M49 50Q20 35 22 10Q45 14 51 40M52 48Q78 30 79 8Q57 12 51 39M50 43Q34 20 43 3Q58 19 52 40" fill="${leaf}"/>`;let flowers=stage>=4?`<g fill="#f0a1a7"><circle cx="24" cy="17" r="8"/><circle cx="38" cy="12" r="8"/><circle cx="33" cy="26" r="8"/><circle cx="62" cy="17" r="8"/><circle cx="75" cy="25" r="8"/></g><g fill="#f5cf72"><circle cx="32" cy="18" r="4"/><circle cx="67" cy="21" r="4"/></g>`:'';return `<svg viewBox="0 0 100 100" width="100%" height="100%" aria-hidden="true"><g class="bob">${leaves}${flowers}<path d="M24 51h53l-5 39q-1 7-9 7H38q-8 0-9-7z" fill="${c}"/><rect x="20" y="48" width="61" height="13" rx="5" fill="${c}"/><circle cx="43" cy="72" r="2.8" fill="#3e403a"/><circle cx="60" cy="72" r="2.8" fill="#3e403a"/><path d="M47 80q5 5 10 0" fill="none" stroke="#3e403a" stroke-width="2.5" stroke-linecap="round"/><circle cx="34" cy="78" r="4" fill="#f2a6a8" opacity=".6"/><circle cx="68" cy="78" r="4" fill="#f2a6a8" opacity=".6"/></g></svg>`}
function productSVG(p){let cat=p.cat,c=cat==='Blush'?'#d78b92':cat==='Lips'?'#b96f6d':cat==='Eyes'?'#594a46':cat==='Base'?'#d4a68d':'#aa8c86';if(cat==='Lips')return `<svg viewBox="0 0 60 130" width="100%" height="100%"><rect x="17" y="55" width="26" height="65" rx="7" fill="#efe6df"/><rect x="20" y="45" width="20" height="20" rx="3" fill="#cdbeb5"/><path d="M22 45v-22l16-8v30z" fill="${c}"/><text x="30" y="92" text-anchor="middle" font-size="7" transform="rotate(-90 30 92)" fill="#685c55">${esc(p.brand.slice(0,8))}</text></svg>`;if(cat==='Eyes')return `<svg viewBox="0 0 60 130" width="100%" height="100%"><rect x="23" y="12" width="14" height="105" rx="7" fill="${c}"/><rect x="21" y="74" width="18" height="43" rx="7" fill="#e7ded7"/><text x="30" y="100" text-anchor="middle" font-size="6" transform="rotate(-90 30 100)" fill="#685c55">${esc(p.brand.slice(0,8))}</text></svg>`;if(cat==='Base')return `<svg viewBox="0 0 70 130" width="100%" height="100%"><rect x="17" y="18" width="36" height="94" rx="12" fill="#f3e3d9"/><rect x="21" y="22" width="28" height="30" rx="8" fill="${c}"/><rect x="23" y="8" width="24" height="18" rx="4" fill="#c7b5aa"/><text x="35" y="86" text-anchor="middle" font-size="7" transform="rotate(-90 35 86)" fill="#685c55">${esc(p.brand.slice(0,8))}</text></svg>`;return `<svg viewBox="0 0 70 130" width="100%" height="100%"><path d="M17 16h36l-4 94q0 8-8 8H29q-8 0-8-8z" fill="#f5e5dc"/><path d="M17 16h36l-1 31H18z" fill="${c}"/><rect x="24" y="112" width="22" height="8" rx="2" fill="#cbbab0"/><text x="35" y="88" text-anchor="middle" font-size="7" transform="rotate(-90 35 88)" fill="#685c55">${esc(p.brand.slice(0,8))}</text></svg>`}
function stage(p){let r=p.uses/p.goal;return r>=1?4:r>=.66?3:r>=.33?2:r>0?1:0}function pct(p){return Math.min(100,Math.round(p.uses/p.goal*100))}
function show(id,push=true){let old=$('.screen.active')?.id;if(push&&old&&old!==id)backStack.push(old);$$('.screen').forEach(x=>x.classList.toggle('active',x.id===id));$('#nav').style.display=['detail','form','calendar','settings'].includes(id)?'none':'grid';$$('.navBtn').forEach(b=>b.classList.toggle('on',b.dataset.go===id));if(id==='calendar')renderCalendar();if(id==='settings')renderSettings();window.scrollTo(0,0)}
function back(){show(backStack.pop()||'garden',false)}
function toast(t){let x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1300)}
function addUse(id){let p=products.find(x=>x.id===id);if(!p)return;p.uses++;history.push({id,date:new Date().toISOString()});save();renderAll();if(current===id)renderDetail();toast(p.uses>=p.goal?'Panned! Your plant bloomed 🌸':'+1 use 🌱')}
function renderGarden(){$('#heroPink').innerHTML=plantSVG('pink',4);$('#heroGreen').innerHTML=plantSVG('green',3);let opts=['Active','All','Finished','By Category'];$('#gardenChips').innerHTML=opts.map(x=>`<button class="chip ${gardenFilter===x?'on':''}" data-gfilter="${x}">${x}</button>`).join('');let ps=products;if(gardenFilter==='Active')ps=ps.filter(p=>p.active&&p.uses<p.goal);if(gardenFilter==='Finished')ps=ps.filter(p=>p.uses>=p.goal);if(gardenFilter==='By Category')ps=[...ps].sort((a,b)=>a.cat.localeCompare(b.cat));$('#gardenGrid').innerHTML=ps.slice(0,gardenFilter==='All'?30:20).map(p=>`<article class="productCard" data-product="${p.id}"><button class="quick" data-use="${p.id}">+1</button><div class="brand">${esc(p.brand)}</div><h3>${esc(p.name)}</h3><div class="artRow"><div class="productArt">${productSVG(p)}</div><div class="plantArt">${plantSVG(p.plant,stage(p))}</div></div><div class="progress"><div class="fill" style="width:${pct(p)}%"></div></div><div class="meta"><span>${p.uses} / ${p.goal}</span><span>${p.active?'Active':'Reserve'}</span></div></article>`).join('')||'<div class="empty">Nothing here yet 🌱</div>'}
function openDetail(id){current=id;renderDetail();show('detail')}
function renderDetail(){let p=products.find(x=>x.id===current);if(!p)return;$('#detailProduct').innerHTML=productSVG(p);$('#detailPlant').innerHTML=plantSVG(p.plant,stage(p));$('#detailName').textContent=p.name;$('#detailBrand').textContent=p.brand;$('#detailTags').innerHTML=[p.cat,'Project Pan',p.active?'Active':'Reserve'].map(x=>`<span class="tag">${x}</span>`).join('');$('#detailUses').textContent=p.uses;$('#detailGoal').textContent=p.goal;$('#detailFill').style.width=pct(p)+'%';$('#detailNotes').textContent=p.notes||'No notes yet.';$('#stages').innerHTML=[0,10,20,30,'Panned'].map((x,i)=>`<div class="stage">${plantSVG(p.plant,i)}<span>${x}</span></div>`).join('')}
function renderCollection(){let cats=['All','Lips','Blush','Eyes','Base','Other'];$('#collectionChips').innerHTML=cats.map(x=>`<button class="chip ${collectionCat===x?'on':''}" data-cat="${x}">${x}</button>`).join('');let q=$('#search').value.toLowerCase();let ps=products.filter(p=>(collectionCat==='All'||p.cat===collectionCat)&&(!q||(p.name+' '+p.brand).toLowerCase().includes(q)));$('#collectionList').innerHTML=ps.map(p=>`<div class="row" data-product="${p.id}"><div class="thumb"><div class="productArt">${productSVG(p)}</div></div><div><div class="brand">${esc(p.brand)}</div><h3>${esc(p.name)}</h3><div class="miniProgress"><span>${p.uses}/${p.goal}</span><div class="progress"><div class="fill" style="width:${pct(p)}%"></div></div></div></div><span>›</span></div>`).join('')}
function renderStats(){let month=new Date().getMonth(),yr=new Date().getFullYear();let monthUses=history.filter(h=>{let d=new Date(h.date);return d.getMonth()===month&&d.getFullYear()===yr}).length;let finished=products.filter(p=>p.uses>=p.goal).length,active=products.filter(p=>p.active&&p.uses<p.goal).length,days=new Set(history.map(h=>h.date.slice(0,10))).size;$('#statGrid').innerHTML=[["🍃",monthUses,'Total Uses'],['🌸',active,'Products In Progress'],['🌱',finished,'Products Finished'],['⭐',days,'Days Tracked']].map(x=>`<div class="statCard"><div class="statIcon">${x[0]}</div><div><b>${x[1]}</b><small>${x[2]}</small></div></div>`).join('');let cats=['Lips','Blush','Eyes','Base','Other'], vals=cats.map(c=>products.filter(p=>p.cat===c).reduce((a,p)=>a+p.uses,0)),max=Math.max(1,...vals);$('#categoryBars').innerHTML=cats.map((c,i)=>`<div class="barRow"><span>${['💋','🌸','👁️','✨','🪞'][i]} ${c}</span><div class="barTrack"><i style="width:${vals[i]/max*100}%"></i></div><b>${vals[i]}</b></div>`).join('')}
function renderPanned(){let done=products.filter(p=>p.uses>=p.goal).slice(0,2);if(!done.length)done=products.filter(p=>p.active).slice(0,2);$('#pannedPlants').innerHTML=done.map((p,i)=>`<div style="width:145px;height:180px">${plantSVG(i?'green':'pink',p.uses>=p.goal?4:stage(p))}</div>`).join('');$('#plaques').innerHTML=done.map(p=>`<div class="plaque">${esc(p.brand)}<br><b>${esc(p.name)}</b><br>${p.uses>=p.goal?'PANNED':'GROWING'}<br>${p.uses}/${p.goal} uses</div>`).join('')}
function renderCalendar(){let y=calDate.getFullYear(),m=calDate.getMonth();$('#monthLabel').textContent=new Intl.DateTimeFormat('en',{month:'long',year:'numeric'}).format(calDate);let first=new Date(y,m,1),start=new Date(y,m,1-first.getDay());let html='';for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let key=localKey(d),has=history.some(h=>localKey(new Date(h.date))===key),sel=key===localKey(selectedDate);html+=`<button class="day ${d.getMonth()!==m?'out':''} ${has?'has':''} ${sel?'sel':''}" data-date="${key}">${d.getDate()}</button>`}$('#days').innerHTML=html;renderDayLogs()}
function localKey(d){let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function renderDayLogs(){let key=localKey(selectedDate);$('#dayLabel').textContent=new Intl.DateTimeFormat('en',{month:'short',day:'numeric',year:'numeric'}).format(selectedDate);let logs=history.filter(h=>localKey(new Date(h.date))===key);let counts={};logs.forEach(h=>counts[h.id]=(counts[h.id]||0)+1);$('#dayLogs').innerHTML=Object.entries(counts).map(([id,n])=>{let p=products.find(x=>x.id===id);return p?`<div class="logRow"><div class="thumb" style="width:36px;height:44px"><div class="productArt" style="height:40px">${productSVG(p)}</div></div><span>${esc(p.name)}</span><b>+${n} use${n>1?'s':''}</b></div>`:''}).join('')||'<div class="empty">No uses logged this day.</div>'}
function renderSettings(){document.documentElement.dataset.theme=settings.theme==='pink'?'':settings.theme;let themes=[['pink','Pink & Green','pink'],['sage','Sage','green'],['warm','Warm','gold'],['slate','Slate','slate']];$('#themeGrid').innerHTML=themes.map(t=>`<button class="themeCard ${settings.theme===t[0]?'on':''}" data-theme="${t[0]}"><div class="themePreview" style="background:${t[0]==='pink'?'#f8dfe0':t[0]==='sage'?'#e1e9df':t[0]==='warm'?'#f5e3c3':'#dfe8ee'}"><div style="width:54px;height:58px">${plantSVG(t[2],4)}</div></div>${t[1]}</button>`).join('');$('#defaultGoal').textContent=settings.defaultGoal;$$('[data-setting]').forEach(b=>b.classList.toggle('on',!!settings[b.dataset.setting]))}
function openForm(id=null){editing=id;let p=id?products.find(x=>x.id===id):null;$('#formTitle').textContent=p?'Edit Product':'Add Product';$('#fName').value=p?.name||'';$('#fBrand').value=p?.brand||'';$('#fCat').value=p?.cat||'Lips';$('#fGoal').value=p?.goal||settings.defaultGoal;$('#fNotes').value=p?.notes||'';selectedPlant=p?.plant||'pink';renderPlantPicker();updateFormArt();show('form')}
function renderPlantPicker(){let kinds=['pink','green','gold','slate'];$('#plantPicker').innerHTML=kinds.map(k=>`<button class="pickPlant ${selectedPlant===k?'on':''}" data-plant="${k}">${plantSVG(k,4)}</button>`).join('')}
function updateFormArt(){let p={brand:$('#fBrand').value||'Brand',name:$('#fName').value||'New Product',cat:$('#fCat').value};$('#formProductArt').innerHTML=productSVG(p);$('#formPlantArt').innerHTML=plantSVG(selectedPlant,4)}
function saveProduct(){let name=$('#fName').value.trim(),brand=$('#fBrand').value.trim();if(!name||!brand){toast('Add a name and brand');return}if(editing){let p=products.find(x=>x.id===editing);Object.assign(p,{name,brand,cat:$('#fCat').value,goal:+$('#fGoal').value||30,notes:$('#fNotes').value,plant:selectedPlant})}else{let i=Date.now();products.unshift({id:slug(brand+'-'+name,i),brand,name,cat:$('#fCat').value,goal:+$('#fGoal').value||30,notes:$('#fNotes').value,plant:selectedPlant,uses:0,active:true,created:new Date().toISOString()})}save();renderAll();toast('Saved 🌱');show('collection',false)}
function renderAll(){renderGarden();renderCollection();renderStats();renderPanned();renderSettings()}

document.addEventListener('click',e=>{let go=e.target.closest('[data-go]');if(go){if(go.dataset.go==='form')openForm();else show(go.dataset.go);return}if(e.target.closest('[data-back]')){back();return}let use=e.target.closest('[data-use]');if(use){e.stopPropagation();addUse(use.dataset.use);return}let prod=e.target.closest('[data-product]');if(prod){openDetail(prod.dataset.product);return}let gf=e.target.closest('[data-gfilter]');if(gf){gardenFilter=gf.dataset.gfilter;renderGarden();return}let cat=e.target.closest('[data-cat]');if(cat){collectionCat=cat.dataset.cat;renderCollection();return}let pl=e.target.closest('[data-plant]');if(pl){selectedPlant=pl.dataset.plant;renderPlantPicker();updateFormArt();return}let th=e.target.closest('[data-theme]');if(th){settings.theme=th.dataset.theme;save();renderSettings();return}let sw=e.target.closest('[data-setting]');if(sw){let k=sw.dataset.setting;settings[k]=!settings[k];save();renderSettings();return}let day=e.target.closest('[data-date]');if(day){selectedDate=new Date(day.dataset.date+'T12:00:00');renderCalendar();return}});
$('#detailUse').onclick=()=>addUse(current);$('#editCurrent').onclick=()=>openForm(current);$('#saveProduct').onclick=saveProduct;$('#search').oninput=renderCollection;['fName','fBrand'].forEach(id=>$('#'+id).oninput=updateFormArt);$('#fCat').onchange=updateFormArt;$('#prevMonth').onclick=()=>{calDate=new Date(calDate.getFullYear(),calDate.getMonth()-1,1);renderCalendar()};$('#nextMonth').onclick=()=>{calDate=new Date(calDate.getFullYear(),calDate.getMonth()+1,1);renderCalendar()};$('#goalMinus').onclick=()=>{settings.defaultGoal=Math.max(1,settings.defaultGoal-5);save();renderSettings()};$('#goalPlus').onclick=()=>{settings.defaultGoal+=5;save();renderSettings()};$('#exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify({products,history,settings},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pan-garden-backup.json';a.click();URL.revokeObjectURL(a.href)};$('#importFile').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(d.products)products=d.products;if(d.history)history=d.history;if(d.settings)settings=d.settings;save();renderAll();toast('Data imported 🌿')}catch{toast('Could not import that file')}};
renderAll();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
